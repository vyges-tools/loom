[package]
name = "vyges-loom"
version = "0.1.52"
edition = "2021"
description = "The shared design-data foundation for the Vyges EDA toolchain: parse-once / query-many readers (Verilog, Liberty, SDC, SPEF) + an in-memory design database. The loom the engines weave on."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/loom"
build = "build.rs"

# One third-party crate at most: miniz_oxide (pure-Rust inflate, already used in the suite by
# vyges-layout). The `fst` feature adds the FST binary-waveform reader, which needs it; LZ4 is
# clean-roomed in-tree. `gzip` is ON by default: netlists, Liberty and parasitics are shipped
# gzipped, and a reader that refuses `.v.gz` unless a feature was remembered at build time is a
# reader that fails in the field. `default-features = false` gives a std-only build.
[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []
default = ["gzip"]
fst = ["dep:miniz_oxide"]
# `netlist::load`/`load_all`, `Lib::load` and `Design::load` read gzipped files (the same
# pure-Rust inflater).
gzip = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "0.8", optional = true }

[lib]
name = "vyges_loom"
path = "src/lib.rs"

[[bin]]
name = "vyges-loom"
path = "src/main.rs"
