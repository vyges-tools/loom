[package]
name = "vyges-loom"
version = "0.1.55"
edition = "2021"
description = "The shared design-data foundation for the Vyges EDA toolchain: parse-once / query-many readers (Verilog, Liberty, SDC, SPEF) + an in-memory design database. The loom the engines weave on."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/loom"
build = "build.rs"

# One third-party crate at most: miniz_oxide (pure-Rust inflate, already used in the suite by
# vyges-layout). The `fst` feature (on by default) adds the FST waveform reader, writer and the
# `fst` query command, which need it; LZ4 and FastLZ are clean-roomed in-tree. `gzip` is ON by
# default: netlists, Liberty and parasitics are shipped gzipped, and a reader that refuses `.v.gz` unless a feature was remembered at build time is a
# reader that fails in the field. `default-features = false` gives a std-only build.
[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []
default = ["gzip", "fst"]
fst = ["dep:miniz_oxide"]
# `netlist::load`/`load_all`, `Lib::load` and `Design::load` read gzipped files (the same
# pure-Rust inflater).
gzip = ["dep:miniz_oxide"]

# The binary's allocator (see [dependencies]). Opt-in, so engines that link this library do not
# build it; the builds that ship the binary pass `--features mimalloc`.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
miniz_oxide = { version = "0.8", optional = true }
# `-regexp` object queries and `switch -regexp` (MIT / Apache-2.0)
regex = "1"

# The binary's global allocator. The reference build links tcmalloc for all of its code
# (BUILD.bazel `malloc = @tcmalloc`), not the system allocator; mimalloc measured fastest and
# smallest of tcmalloc / jemalloc / mimalloc on a like-for-like trial. Pinned exactly:
# libmimalloc-sys 0.1.44 bundles mimalloc v2 by default (0.1.45 on default to v3).
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1.44", default-features = false, optional = true }

# On Linux the allocator also REPLACES malloc/free process-wide (`override`), so C++ code linked
# into the binary allocates through it too, as the reference's statically linked tcmalloc does for
# all of its code. Not on macOS, where the system zone allocator is left alone.
[target.'cfg(target_os = "linux")'.dependencies]
libmimalloc-sys = { version = "=0.1.44", default-features = false, features = ["override"], optional = true }

[lib]
name = "vyges_loom"
path = "src/lib.rs"

[[bin]]
name = "vyges-loom"
path = "src/main.rs"

# The reference is built -O3 with link-time optimisation (Bazel --config=release). LTO and one
# codegen unit let calls inline across crates; by language rule neither changes a result.
[profile.release]
lto = "fat"
codegen-units = 1
